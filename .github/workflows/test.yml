name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: nubjs/setup-nub@v0.6.0
        with:
          nub-version: 0.1.10
          node-version: 22.19.0
      - run: nub install --frozen-lockfile --ignore-scripts
      - run: nub run test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest test_laya_server.py
